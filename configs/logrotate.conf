/var/log/vorn/vornd.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0640 vorn vorn
    postrotate
        systemctl kill --signal=HUP vornd.service 2>/dev/null || true
    endscript
}

/var/log/vorn/audit.log {
    daily
    rotate 365
    compress
    delaycompress
    missingok
    notifempty
    create 0640 vorn vorn
}

/var/log/vorn/gpu-health.log {
    daily
    rotate 90
    compress
    delaycompress
    missingok
    notifempty
    create 0640 vorn vorn
}
